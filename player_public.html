<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0e0a08;
    --bg-2:#1a120d;
    --bg-3:#2a1c14;
    --cream:#f5e9d4;
    --cream-dim:#b8a98e;
    --cream-dimmer:#7a6f5c;
    --amber:#d97757;
    --amber-bright:#f08a5d;
    --gold:#c8a572;
    --line:rgba(245,233,212,0.08);
    --line-strong:rgba(245,233,212,0.15);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;background:var(--bg-1);color:var(--cream);font-family:'Outfit',sans-serif;font-weight:300;letter-spacing:0.01em;overflow-x:hidden}
  body{
    background:
      radial-gradient(ellipse at top, rgba(217,119,87,0.15), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(200,165,114,0.08), transparent 50%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    min-height:100vh;
    position:relative;
  }
  /* Film grain overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:0.06;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode:overlay;
  }

  .wrap{
    max-width:1180px;
    margin:0 auto;
    padding:48px 28px 80px;
    position:relative;
    z-index:2;
  }

  /* Header */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:54px;
    padding-bottom:24px;
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{
    width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--amber-bright), var(--amber) 50%, #5a2e1f 100%);
    box-shadow:0 0 24px rgba(217,119,87,0.4), inset 0 0 12px rgba(0,0,0,0.4);
    position:relative;
  }
  .brand-mark::after{
    content:"";
    position:absolute;inset:38%;
    border-radius:50%;
    background:var(--bg-1);
    box-shadow:inset 0 0 4px rgba(0,0,0,0.8);
  }
  .brand-text{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:500;
    letter-spacing:0.02em;
    font-style:italic;
  }
  .brand-text span{color:var(--amber);font-style:normal;font-weight:600;}
  .live-tag{
    display:flex;align-items:center;gap:8px;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}

  /* Main grid */
  .grid{
    display:grid;
    grid-template-columns:1.1fr 1fr;
    gap:60px;
    align-items:start;
  }
  @media (max-width:880px){.grid{grid-template-columns:1fr;gap:40px}}

  /* Now playing column */
  .now-playing{position:relative}
  .now-label{
    font-size:11px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--cream-dimmer);
    margin-bottom:24px;
  }

  .artwork-frame{
    position:relative;
    width:100%;
    aspect-ratio:1;
    border-radius:8px;
    overflow:hidden;
    background:var(--bg-3);
    box-shadow:
      0 30px 80px -20px rgba(217,119,87,0.35),
      0 0 0 1px var(--line-strong),
      inset 0 0 60px rgba(0,0,0,0.4);
  }
  .artwork-frame::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(217,119,87,0.1), transparent 40%);
    z-index:2;pointer-events:none;
  }
  .artwork-frame img{
    width:100%;height:100%;
    object-fit:cover;
    transition:transform 1.6s cubic-bezier(0.2,0.8,0.2,1);
  }
  .artwork-frame.playing img{transform:scale(1.06)}
  .artwork-placeholder{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%, #3a2418, var(--bg-1));
    color:var(--amber);
    font-family:'Fraunces',serif;
    font-size:64px;
    font-style:italic;
  }

  /* Visualizer overlay */
  .viz{
    position:absolute;
    bottom:18px;left:18px;
    display:flex;align-items:flex-end;gap:3px;
    height:28px;
    opacity:0;transition:opacity 0.4s;
    z-index:3;
  }
  .viz.on{opacity:1}
  .viz-bar{
    width:3px;
    background:var(--cream);
    border-radius:1px;
    animation:viz 0.9s ease-in-out infinite;
  }
  .viz-bar:nth-child(1){height:40%;animation-delay:-0.6s}
  .viz-bar:nth-child(2){height:80%;animation-delay:-0.2s}
  .viz-bar:nth-child(3){height:60%;animation-delay:-0.4s}
  .viz-bar:nth-child(4){height:90%;animation-delay:-0.1s}
  .viz-bar:nth-child(5){height:50%;animation-delay:-0.3s}
  @keyframes viz{0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)}}

  .track-info{margin-top:32px}
  .track-title{
    font-family:'Fraunces',serif;
    font-size:38px;
    font-weight:500;
    line-height:1.1;
    letter-spacing:-0.01em;
    margin-bottom:8px;
  }
  .track-artist{
    font-size:15px;
    color:var(--cream-dim);
    letter-spacing:0.04em;
  }

  /* Progress */
  .progress-wrap{margin-top:28px}
  .progress-bar{
    height:4px;
    background:var(--line);
    border-radius:2px;
    position:relative;
    cursor:pointer;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--amber), var(--amber-bright));
    width:0%;
    border-radius:2px;
    transition:width 0.1s linear;
    position:relative;
  }
  .progress-fill::after{
    content:"";
    position:absolute;
    right:-6px;top:50%;transform:translateY(-50%);
    width:12px;height:12px;border-radius:50%;
    background:var(--cream);
    box-shadow:0 0 8px rgba(245,233,212,0.5);
    opacity:0;
    transition:opacity 0.2s;
  }
  .progress-bar:hover .progress-fill::after{opacity:1}
  .time-row{
    display:flex;justify-content:space-between;
    margin-top:10px;
    font-size:12px;
    color:var(--cream-dimmer);
    font-variant-numeric:tabular-nums;
    letter-spacing:0.05em;
  }

  /* Controls */
  .controls{
    display:flex;align-items:center;justify-content:center;
    gap:18px;
    margin-top:30px;
  }
  .ctrl{
    background:none;
    border:none;
    color:var(--cream);
    cursor:pointer;
    padding:10px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:all 0.25s;
    opacity:0.75;
  }
  .ctrl:hover{opacity:1;background:var(--line)}
  .ctrl svg{width:22px;height:22px}
  .ctrl.small svg{width:18px;height:18px}
  .ctrl.active{color:var(--amber);opacity:1}
  .ctrl.play-btn{
    background:var(--cream);
    color:var(--bg-1);
    width:64px;height:64px;
    opacity:1;
    box-shadow:0 8px 24px rgba(245,233,212,0.15);
  }
  .ctrl.play-btn:hover{
    transform:scale(1.05);
    background:var(--cream);
    box-shadow:0 8px 30px rgba(245,233,212,0.25);
  }
  .ctrl.play-btn svg{width:26px;height:26px}

  /* Bottom row: volume + extras */
  .bottom-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-top:32px;
    padding-top:24px;
    border-top:1px solid var(--line);
  }
  .vol-wrap{display:flex;align-items:center;gap:10px;flex:1;max-width:200px}
  .vol-slider{
    flex:1;
    height:3px;
    -webkit-appearance:none;
    appearance:none;
    background:var(--line);
    border-radius:2px;
    outline:none;
    cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:12px;height:12px;
    border-radius:50%;
    background:var(--cream);
    cursor:pointer;
  }
  .vol-slider::-moz-range-thumb{
    width:12px;height:12px;
    border-radius:50%;
    background:var(--cream);
    cursor:pointer;
    border:none;
  }
  .track-count{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream-dimmer);
  }

  /* Playlist column */
  .playlist-col{
    background:linear-gradient(180deg, rgba(245,233,212,0.02), transparent);
    border:1px solid var(--line);
    border-radius:12px;
    padding:32px 28px;
    max-height:680px;
    display:flex;
    flex-direction:column;
  }
  .playlist-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:24px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .playlist-title{
    font-family:'Fraunces',serif;
    font-size:24px;
    font-weight:500;
    font-style:italic;
  }
  .playlist-sub{
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream-dimmer);
  }
  .playlist{
    flex:1;
    overflow-y:auto;
    padding-right:6px;
    margin-right:-6px;
  }
  .playlist::-webkit-scrollbar{width:4px}
  .playlist::-webkit-scrollbar-track{background:transparent}
  .playlist::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}

  .track{
    display:grid;
    grid-template-columns:30px 48px 1fr auto;
    gap:14px;
    align-items:center;
    padding:12px 8px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.2s;
    margin-bottom:4px;
  }
  .track:hover{background:rgba(245,233,212,0.04)}
  .track.active{background:rgba(217,119,87,0.1)}
  .track.active .track-num{color:var(--amber)}
  .track.active .t-title{color:var(--amber-bright)}
  .track-num{
    font-size:12px;
    color:var(--cream-dimmer);
    font-variant-numeric:tabular-nums;
    text-align:center;
    font-family:'Fraunces',serif;
    font-style:italic;
  }
  .track-thumb{
    width:48px;height:48px;
    border-radius:6px;
    object-fit:cover;
    background:var(--bg-3);
  }
  .track-thumb-placeholder{
    width:48px;height:48px;
    border-radius:6px;
    background:linear-gradient(135deg, #3a2418, #1a120d);
    display:flex;align-items:center;justify-content:center;
    color:var(--amber);
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:18px;
  }
  .t-meta{min-width:0}
  .t-title{
    font-size:14px;
    font-weight:400;
    color:var(--cream);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:3px;
  }
  .t-artist{
    font-size:12px;
    color:var(--cream-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .t-badge{
    font-size:9px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--cream-dimmer);
    padding:3px 8px;
    border:1px solid var(--line-strong);
    border-radius:20px;
  }

  /* Empty state */
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--cream-dimmer);
  }
  .empty-icon{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:48px;
    color:var(--amber);
    opacity:0.5;
    margin-bottom:12px;
  }
  .empty-text{font-size:14px;letter-spacing:0.05em}

  /* Loading */
  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--cream-dim);
    font-size:13px;
    letter-spacing:0.1em;
  }

  /* Hidden YT player */
  #yt-player-mount{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}

  /* Footer note */
  .footer{
    margin-top:60px;
    text-align:center;
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--cream-dimmer);
  }
  .footer span{color:var(--amber);font-style:italic;font-family:'Fraunces',serif;text-transform:none;letter-spacing:0.02em}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-text">Midnight <span>FM</span></div>
    </div>
    <div class="live-tag">
      <span class="live-dot"></span>
      <span>On Air</span>
    </div>
  </header>

  <div class="grid">
    <!-- Now Playing -->
    <section class="now-playing">
      <div class="now-label">— Now Playing</div>

      <div class="artwork-frame" id="artFrame">
        <div class="artwork-placeholder" id="artPlaceholder">♪</div>
        <img id="artImg" alt="" style="display:none">
        <div class="viz" id="viz">
          <div class="viz-bar"></div>
          <div class="viz-bar"></div>
          <div class="viz-bar"></div>
          <div class="viz-bar"></div>
          <div class="viz-bar"></div>
        </div>
      </div>

      <div class="track-info">
        <div class="track-title" id="trackTitle">Select a track</div>
        <div class="track-artist" id="trackArtist">— Tune in below —</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl small" id="shuffleBtn" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
        </button>
        <button class="ctrl play-btn" id="playBtn" aria-label="Play">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ctrl" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
        </button>
        <button class="ctrl small" id="repeatBtn" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>

      <div class="bottom-row">
        <div class="vol-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--cream-dim)"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          <input type="range" min="0" max="100" value="70" class="vol-slider" id="volSlider">
        </div>
        <div class="track-count" id="trackCount">— Tracks</div>
      </div>
    </section>

    <!-- Playlist -->
    <aside class="playlist-col">
      <div class="playlist-head">
        <div class="playlist-title">The Queue</div>
        <div class="playlist-sub" id="queueSub">Loading…</div>
      </div>
      <div class="playlist" id="playlist">
        <div class="loading">— Tuning in —</div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    Crafted with <span>♪</span> for late nights
  </footer>
</div>

<div id="yt-player-mount"></div>

<!-- ==================== FIREBASE SDK ==================== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- ==================== YOUTUBE IFRAME API ==================== -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>
/* ============================================================
   STEP 1 — PASTE YOUR FIREBASE CONFIG HERE
   Get it from: console.firebase.google.com → Project Settings
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCVBIu7nqxNH9YXzqLrLnjZ95vRKRVDZLc",
  authDomain: "midnight-fm-b2018.firebaseapp.com",
  databaseURL: "https://midnight-fm-b2018-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "midnight-fm-b2018",
  storageBucket: "midnight-fm-b2018.firebasestorage.app",
  messagingSenderId: "939233885242",
  appId: "1:939233885242:web:68eca838547489e0ba0903",
  measurementId: "G-2T3Y4K68HV"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ============================================================
   PLAYER STATE
   ============================================================ */
let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let isShuffle = false;
let repeatMode = 0; // 0 = off, 1 = all, 2 = one
let activeSource = null; // 'audio' or 'youtube'
let ytPlayer = null;
let ytReady = false;
let progressTimer = null;

const audio = new Audio();
audio.preload = "metadata";

/* ============================================================
   DOM REFS
   ============================================================ */
const $ = (id) => document.getElementById(id);
const els = {
  art: $("artImg"), artPlaceholder: $("artPlaceholder"), artFrame: $("artFrame"),
  title: $("trackTitle"), artist: $("trackArtist"),
  playBtn: $("playBtn"), playIcon: $("playIcon"), pauseIcon: $("pauseIcon"),
  prevBtn: $("prevBtn"), nextBtn: $("nextBtn"),
  shuffleBtn: $("shuffleBtn"), repeatBtn: $("repeatBtn"),
  progressBar: $("progressBar"), progressFill: $("progressFill"),
  curTime: $("curTime"), durTime: $("durTime"),
  volSlider: $("volSlider"),
  playlist: $("playlist"), queueSub: $("queueSub"), trackCount: $("trackCount"),
  viz: $("viz")
};

/* ============================================================
   YOUTUBE API READY
   ============================================================ */
function onYouTubeIframeAPIReady() {
  ytPlayer = new YT.Player('yt-player-mount', {
    height: '1', width: '1',
    playerVars: { autoplay:0, controls:0, disablekb:1, fs:0, modestbranding:1, playsinline:1 },
    events: {
      'onReady': () => { ytReady = true; },
      'onStateChange': onYTStateChange
    }
  });
}
function onYTStateChange(e){
  if(e.data === YT.PlayerState.ENDED){ handleTrackEnded(); }
  else if(e.data === YT.PlayerState.PLAYING){ setPlayingUI(true); startProgress(); }
  else if(e.data === YT.PlayerState.PAUSED){ setPlayingUI(false); stopProgress(); }
}

/* ============================================================
   LOAD PLAYLIST FROM FIREBASE
   ============================================================ */
db.ref('playlist').on('value', snap => {
  const data = snap.val();
  playlist = [];
  if(data){
    Object.keys(data).forEach(key => {
      playlist.push({ id:key, ...data[key] });
    });
    playlist.sort((a,b) => (a.order||0) - (b.order||0));
  }
  renderPlaylist();
});

/* ============================================================
   URL DETECTION
   ============================================================ */
function parseYouTubeID(url){
  if(!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/v\/)([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

/* ============================================================
   RENDER PLAYLIST
   ============================================================ */
function renderPlaylist(){
  const el = els.playlist;
  els.trackCount.textContent = `${playlist.length} Tracks`;
  els.queueSub.textContent = `${playlist.length} in queue`;

  if(playlist.length === 0){
    el.innerHTML = `
      <div class="empty">
        <div class="empty-icon">♪</div>
        <div class="empty-text">The queue is empty</div>
      </div>`;
    return;
  }

  el.innerHTML = playlist.map((t, i) => {
    const isYT = parseYouTubeID(t.url) !== null;
    const cover = t.cover ? `<img src="${escapeHTML(t.cover)}" class="track-thumb" alt="" onerror="this.outerHTML='<div class=track-thumb-placeholder>♪</div>'">` : `<div class="track-thumb-placeholder">♪</div>`;
    return `
      <div class="track ${i===currentIndex?'active':''}" data-i="${i}">
        <div class="track-num">${String(i+1).padStart(2,'0')}</div>
        ${cover}
        <div class="t-meta">
          <div class="t-title">${escapeHTML(t.title || 'Untitled')}</div>
          <div class="t-artist">${escapeHTML(t.artist || 'Unknown artist')}</div>
        </div>
        <div class="t-badge">${isYT?'YT':'MP3'}</div>
      </div>`;
  }).join('');

  el.querySelectorAll('.track').forEach(node => {
    node.addEventListener('click', () => {
      const i = parseInt(node.dataset.i, 10);
      loadAndPlay(i);
    });
  });
}

function escapeHTML(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   LOAD A TRACK
   ============================================================ */
function loadAndPlay(index){
  if(index < 0 || index >= playlist.length) return;
  currentIndex = index;
  const track = playlist[index];

  // Stop whatever's playing
  audio.pause();
  if(ytReady && ytPlayer && ytPlayer.stopVideo){ try{ ytPlayer.stopVideo(); }catch(e){} }

  // Update UI
  els.title.textContent = track.title || 'Untitled';
  els.artist.textContent = track.artist || 'Unknown artist';
  if(track.cover){
    els.art.src = track.cover;
    els.art.style.display = 'block';
    els.artPlaceholder.style.display = 'none';
    els.art.onerror = () => { els.art.style.display='none'; els.artPlaceholder.style.display='flex'; };
  } else {
    els.art.style.display='none';
    els.artPlaceholder.style.display='flex';
  }

  // Determine source
  const ytId = parseYouTubeID(track.url);
  if(ytId){
    activeSource = 'youtube';
    if(ytReady){
      ytPlayer.loadVideoById(ytId);
      ytPlayer.setVolume(parseInt(els.volSlider.value,10));
    } else {
      // Retry in a moment if YT not ready yet
      setTimeout(() => loadAndPlay(index), 600);
      return;
    }
  } else {
    activeSource = 'audio';
    audio.src = track.url;
    audio.volume = parseInt(els.volSlider.value,10) / 100;
    audio.play().catch(err => console.warn('Audio play blocked:', err));
  }

  renderPlaylist();
}

/* ============================================================
   PLAY / PAUSE
   ============================================================ */
els.playBtn.addEventListener('click', () => {
  if(currentIndex === -1){
    if(playlist.length > 0) loadAndPlay(0);
    return;
  }
  if(activeSource === 'audio'){
    audio.paused ? audio.play() : audio.pause();
  } else if(activeSource === 'youtube' && ytReady){
    const state = ytPlayer.getPlayerState();
    if(state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
    else ytPlayer.playVideo();
  }
});

audio.addEventListener('play', () => { setPlayingUI(true); startProgress(); });
audio.addEventListener('pause', () => { setPlayingUI(false); stopProgress(); });
audio.addEventListener('ended', handleTrackEnded);
audio.addEventListener('loadedmetadata', () => { els.durTime.textContent = fmtTime(audio.duration); });

function setPlayingUI(playing){
  isPlaying = playing;
  els.playIcon.style.display = playing ? 'none' : 'block';
  els.pauseIcon.style.display = playing ? 'block' : 'none';
  els.viz.classList.toggle('on', playing);
  els.artFrame.classList.toggle('playing', playing);
}

/* ============================================================
   NEXT / PREV / END
   ============================================================ */
function handleTrackEnded(){
  if(repeatMode === 2){ loadAndPlay(currentIndex); return; }
  nextTrack();
}
function nextTrack(){
  if(playlist.length === 0) return;
  if(isShuffle){
    let next = Math.floor(Math.random()*playlist.length);
    if(playlist.length>1 && next === currentIndex) next = (next+1)%playlist.length;
    loadAndPlay(next);
  } else {
    if(currentIndex + 1 < playlist.length) loadAndPlay(currentIndex+1);
    else if(repeatMode === 1) loadAndPlay(0);
  }
}
function prevTrack(){
  if(playlist.length === 0) return;
  if(currentIndex - 1 >= 0) loadAndPlay(currentIndex-1);
  else loadAndPlay(playlist.length-1);
}
els.nextBtn.addEventListener('click', nextTrack);
els.prevBtn.addEventListener('click', prevTrack);

/* ============================================================
   SHUFFLE / REPEAT
   ============================================================ */
els.shuffleBtn.addEventListener('click', () => {
  isShuffle = !isShuffle;
  els.shuffleBtn.classList.toggle('active', isShuffle);
});
els.repeatBtn.addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  els.repeatBtn.classList.toggle('active', repeatMode > 0);
  els.repeatBtn.title = ['Repeat: off','Repeat: all','Repeat: one'][repeatMode];
});

/* ============================================================
   PROGRESS BAR
   ============================================================ */
function startProgress(){
  stopProgress();
  progressTimer = setInterval(updateProgress, 250);
}
function stopProgress(){ if(progressTimer){ clearInterval(progressTimer); progressTimer=null; } }

function updateProgress(){
  let cur=0, dur=0;
  if(activeSource === 'audio'){
    cur = audio.currentTime; dur = audio.duration || 0;
  } else if(activeSource === 'youtube' && ytReady){
    try { cur = ytPlayer.getCurrentTime(); dur = ytPlayer.getDuration(); } catch(e){}
  }
  if(dur > 0){
    els.progressFill.style.width = (cur/dur*100) + '%';
    els.curTime.textContent = fmtTime(cur);
    els.durTime.textContent = fmtTime(dur);
  }
}

els.progressBar.addEventListener('click', (e) => {
  const rect = els.progressBar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(activeSource === 'audio' && audio.duration){
    audio.currentTime = audio.duration * pct;
  } else if(activeSource === 'youtube' && ytReady){
    const dur = ytPlayer.getDuration();
    ytPlayer.seekTo(dur * pct, true);
  }
});

function fmtTime(s){
  if(!s || isNaN(s)) return '0:00';
  s = Math.floor(s);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

/* ============================================================
   VOLUME
   ============================================================ */
els.volSlider.addEventListener('input', () => {
  const v = parseInt(els.volSlider.value, 10);
  audio.volume = v / 100;
  if(ytReady && ytPlayer && ytPlayer.setVolume){ ytPlayer.setVolume(v); }
});
</script>
</body>
</html>
